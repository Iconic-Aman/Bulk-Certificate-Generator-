[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aman", email = "aman.apk01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "reportlab[pycairo]>=5.0.1",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
